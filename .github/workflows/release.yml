name: Release

# 安装包不入库。打 tag（如 `git tag v1.2.0 && git push origin v1.2.0`）后，
# 本工作流构建 macOS arm64 / Windows x64 / Linux x86_64 三份产物并挂到 GitHub Release，
# 并把三平台安装包同步上传到 Gitee「发行版」。
#
# Gitee 上传策略（v2026.09.11 重构）：
#   · 三个平台各一个独立 job（并行），单包失败不影响其它包，也避免串行把
#     整个 job 拖到 6h 上限；
#   · 每个包都走 .github/scripts/gitee_upload.sh：幂等（重跑只补传失败的包）、
#     动态超时（按 5KB/s 估速，上限 2.5h）+ 动态速度底线（下限 5KB/s，持续
#     300s 判死重试 1 次）、上传后二次核验；
#   · 旧版（v2026.09.10）把 Windows/macOS 串在一个 step，动态底线按
#     size/60min 算到 ~20KB/s，跨境常态 10~20KB/s 链路一低于它即判死，
#     3 次重试全败 → mac 包一直传不上。新参数让 10~20KB/s 链路稳定传完。
#   · Linux 大包（>100MB）超过 Gitee 单附件硬限制时主动跳过并提示去 GitHub 下载。
#
# 触发方式（任意一种都会自动打包含）：
#   1. git push origin vX.Y.Z          —— 推荐，全自动建 Release + 上传包
#   2. GitHub 网页上点"发布 Release"    —— 兼容手动发版，CI 补传构建包
#   3. Actions 页面手动 workflow_dispatch —— 调试用
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 与 ci.yml 共用同一个可复用工作流，保证「CI 能构建」等价于「发版能构建」
  build:
    uses: ./.github/workflows/build.yml
    # 若已按下方说明给 build.yml 加了 ref 输入，取消注释以确保
    # release 事件触发时检出的是 tag 对应代码，而非默认分支最新 commit。
    # with:
    #   ref: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    # push tags 时 github.ref = refs/tags/vX；release 事件时走 event_name 判断
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      # 统一解析 tag 名：push tags 从 github.ref 取，release 事件从 event 取，
      # 供 softprops/action-gh-release 精确定位到目标 Release（避免误建新 Release）。
      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          draft: false

  # ── Gitee「发行版」同步（幂等，可安全重跑）────────────────────────────
  # 前置：GitHub 仓库 Settings -> Secrets -> Actions 添加 GITEE_TOKEN
  # （Gitee 私人令牌，勾选 projects 权限）；Gitee 仓库需已推送同名 tag。
  # 本 job 只创建/定位 Gitee 发行版，输出 rid/api 供三个上传 job 并行使用。
  gitee-prepare:
    name: Prepare Gitee release
    needs: [release]
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gitee.outputs.ready }}
      rid: ${{ steps.gitee.outputs.rid }}
      api: ${{ steps.gitee.outputs.api }}
    steps:
      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Gitee release
        id: gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: Jcs2026
          GITEE_REPO: super_adb
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "::warning::未配置 GITEE_TOKEN（Gitee 私人令牌），跳过同步到 Gitee 发行版"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          # 幂等：查找同名 tag 的 Gitee 发行版，不存在则创建
          EXIST=$(curl -s --max-time 60 "${API}/releases?per_page=100&access_token=${GITEE_TOKEN}" || echo "[]")
          RID=$(echo "${EXIST}" | python -c "import json,sys,os; data=json.load(sys.stdin); tag=os.environ.get('TAG',''); print(next((str(r['id']) for r in data if r.get('tag_name')==tag), ''))")
          if [ -z "${RID}" ]; then
            echo "==> 创建 Gitee 发行版 ${TAG}"
            RESP=$(curl -s --max-time 60 -X POST "${API}/releases" \
              -H "Content-Type: application/json;charset=UTF-8" \
              -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Super_ADB ${TAG} 发布包（GitHub Actions 自动发布）\",\"target_commitish\":\"master\",\"prerelease\":false}")
            RID=$(echo "${RESP}" | python -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          fi
          test -n "${RID}" || { echo "::error::无法定位/创建 Gitee 发行版"; exit 1; }
          echo "==> Gitee release id=${RID}"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "rid=${RID}" >> "$GITHUB_OUTPUT"
          echo "api=${API}" >> "$GITHUB_OUTPUT"

  # 三平台各自独立 job 并行上传：单包失败不阻塞其它包；
  # 幂等：重跑时已成功附件自动跳过，只补传失败的包。
  gitee-upload-windows:
    name: Upload Windows artifact to Gitee
    needs: [gitee-prepare]
    if: needs.gitee-prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      API: ${{ needs.gitee-prepare.outputs.api }}
      RID: ${{ needs.gitee-prepare.outputs.rid }}
    steps:
      # 上传脚本在仓库里，必须先检出代码（download-artifact 不包含仓库文件）
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Super_ADB-windows-x64
          path: artifact
      - name: Upload to Gitee
        run: |
          bash .github/scripts/gitee_upload.sh \
            artifact/Super_ADB-windows-x64.zip "${API}" "${RID}" Super_ADB-windows-x64.zip

  gitee-upload-macos:
    name: Upload macOS artifact to Gitee
    needs: [gitee-prepare]
    if: needs.gitee-prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      API: ${{ needs.gitee-prepare.outputs.api }}
      RID: ${{ needs.gitee-prepare.outputs.rid }}
    steps:
      # 上传脚本在仓库里，必须先检出代码（download-artifact 不包含仓库文件）
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Super_ADB-macos-arm64
          path: artifact
      - name: Upload to Gitee
        run: |
          bash .github/scripts/gitee_upload.sh \
            artifact/Super_ADB-macos-arm64.zip "${API}" "${RID}" Super_ADB-macos-arm64.zip

  gitee-upload-linux:
    name: Upload Linux artifact to Gitee
    needs: [gitee-prepare]
    if: needs.gitee-prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      API: ${{ needs.gitee-prepare.outputs.api }}
      RID: ${{ needs.gitee-prepare.outputs.rid }}
    steps:
      # 上传脚本在仓库里，必须先检出代码（download-artifact 不包含仓库文件）
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Super_ADB-linux-x86_64
          path: artifact
      - name: Upload to Gitee
        run: |
          bash .github/scripts/gitee_upload.sh \
            artifact/Super_ADB-linux-x86_64.tar.gz "${API}" "${RID}" Super_ADB-linux-x86_64.tar.gz
