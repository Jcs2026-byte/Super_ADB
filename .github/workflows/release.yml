name: Release

# 安装包不入库。打 tag（如 `git tag v1.2.0 && git push origin v1.2.0`）后，
# 本工作流构建 macOS arm64 / Windows x64 / Linux x86_64 三份产物并挂到 GitHub Release，
# 并把三平台安装包同步上传到 Gitee「发行版」。Gitee 上传拆两步：
#   ① 小包（Windows/macOS zip）先行上传，快速完成；
#   ② Linux 大包（约 107MB）单独一步，长超时（30min/次）× 5 次重试 + 上传后核验，
#      仍失败时该 step 报红并提示补救（重跑 / 手动上传 / Gitee Go 流水线兜底）。
#
# 触发方式（任意一种都会自动打包含）：
#   1. git push origin vX.Y.Z          —— 推荐，全自动建 Release + 上传包
#   2. GitHub 网页上点"发布 Release"    —— 兼容手动发版，CI 补传构建包
#   3. Actions 页面手动 workflow_dispatch —— 调试用
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 与 ci.yml 共用同一个可复用工作流，保证「CI 能构建」等价于「发版能构建」
  build:
    uses: ./.github/workflows/build.yml
    # 若已按下方说明给 build.yml 加了 ref 输入，取消注释以确保
    # release 事件触发时检出的是 tag 对应代码，而非默认分支最新 commit。
    # with:
    #   ref: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    # push tags 时 github.ref = refs/tags/vX；release 事件时走 event_name 判断
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      # 统一解析 tag 名：push tags 从 github.ref 取，release 事件从 event 取，
      # 供 softprops/action-gh-release 精确定位到目标 Release（避免误建新 Release）。
      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          draft: false

      # ── Gitee「发行版」同步（幂等，可安全重跑）────────────────────────
      # 前置：GitHub 仓库 Settings -> Secrets -> Actions 添加 GITEE_TOKEN
      # （Gitee 私人令牌，勾选 projects 权限）；Gitee 仓库需已推送同名 tag。
      # 拆分原则：Windows/macOS 小包先上传（不阻塞用户下载），
      # Linux 大包单独一步用长超时重试，失败报红并给出补救提示。
      - name: Prepare Gitee release
        id: gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: Jcs2026
          GITEE_REPO: super_adb
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "::warning::未配置 GITEE_TOKEN（Gitee 私人令牌），跳过同步到 Gitee 发行版"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          # 幂等：查找同名 tag 的 Gitee 发行版，不存在则创建
          EXIST=$(curl -s --max-time 60 "${API}/releases?per_page=100&access_token=${GITEE_TOKEN}" || echo "[]")
          RID=$(echo "${EXIST}" | python -c "import json,sys,os; data=json.load(sys.stdin); tag=os.environ.get('TAG',''); print(next((str(r['id']) for r in data if r.get('tag_name')==tag), ''))")
          if [ -z "${RID}" ]; then
            echo "==> 创建 Gitee 发行版 ${TAG}"
            RESP=$(curl -s --max-time 60 -X POST "${API}/releases" \
              -H "Content-Type: application/json;charset=UTF-8" \
              -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Super_ADB ${TAG} 发布包（GitHub Actions 自动发布）\",\"target_commitish\":\"master\",\"prerelease\":false}")
            RID=$(echo "${RESP}" | python -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          fi
          test -n "${RID}" || { echo "::error::无法定位/创建 Gitee 发行版"; exit 1; }
          echo "==> Gitee release id=${RID}"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "rid=${RID}" >> "$GITHUB_OUTPUT"
          echo "api=${API}" >> "$GITHUB_OUTPUT"

      # 小包先行：Windows / macOS 各 50~60MB，普通超时即可，失败即报错中断
      # （小包都传不上，说明 token / 网络有真问题，需要人工介入）。
      - name: Upload Windows/macOS artifacts to Gitee
        if: steps.gitee.outputs.ready == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          API: ${{ steps.gitee.outputs.api }}
          RID: ${{ steps.gitee.outputs.rid }}
        run: |
          set -e
          for f in artifacts/Super_ADB-windows-x64.zip artifacts/Super_ADB-macos-arm64.zip; do
            [ -e "${f}" ] || { echo "::warning::缺少附件 ${f}，跳过"; continue; }
            base=$(basename "${f}")
            # 幂等：同名附件已存在则跳过
            if curl -s --max-time 60 "${API}/releases/${RID}/attach_files?per_page=100&access_token=${GITEE_TOKEN}" \
                | python -c "import json,sys; data=json.load(sys.stdin); names=[a.get('name','') for a in data]; sys.exit(0 if '${base}' in names else 1)" 2>/dev/null; then
              echo "==> 已存在附件 ${base}，跳过"
              continue
            fi
            echo "==> 上传 ${base} ($(du -h "${f}" | cut -f1)) -> release ${RID}"
            RESP=$(curl -s --connect-timeout 30 --max-time 1800 --retry 1 --retry-delay 5 \
              -X POST "${API}/releases/${RID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" -F "file=@${f}")
            if echo "${RESP}" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('id'); print('    uploaded id=', d.get('id'))" 2>/dev/null; then
              echo "    ${base} 上传成功"
            else
              echo "::error::Gitee 上传 ${base} 失败: ${RESP:0:300}"
              exit 1
            fi
          done

      # Linux 大包单独一步：跨境限速，5min×1 重试快速失败 + 上传后二次核验。
      # 仍失败 → step 报红，日志给出三种补救方式（幂等重跑 / 手动上传 / Gitee Go 兜底）。
      - name: Upload Linux artifact to Gitee (large file, long timeout)
        if: steps.gitee.outputs.ready == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          API: ${{ steps.gitee.outputs.api }}
          RID: ${{ steps.gitee.outputs.rid }}
        run: |
          set -e
          f=artifacts/Super_ADB-linux-x86_64.tar.gz
          base=$(basename "${f}")
          if [ ! -e "${f}" ]; then
            echo "::warning::缺少附件 ${f}，跳过（GitHub Release 仍已正常发布）"
            exit 0
          fi
          # Gitee 单附件硬限制 100MB：超限则跳过上传并提示去 GitHub 下载（上传必败，不再空耗）
          SIZE=$(stat -c %s "${f}")
          if [ "${SIZE}" -gt 104857600 ]; then
            echo "::warning::${base} 大小 ${SIZE} 字节（约 $((SIZE/1024/1024))MB）超过 Gitee 单附件 100MB 限制，跳过上传"
            echo "::warning::Linux 安装包仅提供 GitHub Release 下载：https://github.com/Jcs2026-byte/Super_ADB/releases"
            exit 0
          fi
          # 幂等：同名附件已存在则跳过
          if curl -s --max-time 60 "${API}/releases/${RID}/attach_files?per_page=100&access_token=${GITEE_TOKEN}" \
              | python -c "import json,sys; data=json.load(sys.stdin); names=[a.get('name','') for a in data]; sys.exit(0 if '${base}' in names else 1)" 2>/dev/null; then
            echo "==> 已存在附件 ${base}，跳过"
            exit 0
          fi
          echo "==> 上传 ${base} ($(du -h "${f}" | cut -f1)) -> release ${RID}"
          echo "    大文件：跨境限速，5min/次 × 1 次重试，超时即快速失败"
          RESP=$(curl -s --connect-timeout 30 --max-time 1800 --retry 1 --retry-delay 5 \
            -X POST "${API}/releases/${RID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" -F "file=@${f}")
          if echo "${RESP}" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('id'); print('    uploaded id=', d.get('id'))" 2>/dev/null; then
            # 二次核验：响应虽成功，再确认附件真实出现在列表中（防半截上传）
            sleep 3
            if curl -s --max-time 60 "${API}/releases/${RID}/attach_files?per_page=100&access_token=${GITEE_TOKEN}" \
                | python -c "import json,sys; data=json.load(sys.stdin); names=[a.get('name','') for a in data]; sys.exit(0 if '${base}' in names else 1)" 2>/dev/null; then
              echo "    ${base} 上传成功并通过核验"
            else
              echo "::error::${base} 上传响应成功但 Gitee 附件列表中未出现，视为失败"
              exit 1
            fi
          else
            echo "::error::Gitee 上传 ${base} 失败: ${RESP:0:300}"
            echo "::error::补救方式：1) 本页右上角 Re-run all jobs 重跑（幂等，已存在附件跳过）；"
            echo "::error::2) 手动上传：从 GitHub Release 下载 ${base}，到 Gitee 发行版页面添加附件；"
            echo "::error::3) 在 Gitee 仓库配置 Gitee Go 流水线兜底构建/发布 Linux 包。"
            exit 1
          fi
